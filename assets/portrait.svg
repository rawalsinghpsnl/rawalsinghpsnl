    <stop offset="0" stop-color="#0A101F"/><stop offset="1" stop-color="#0C1426"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect x="8" y="8" width="1164" height="544" rx="16" fill="url(#panelGrad)" stroke="url(#accent)" stroke-width="2"/>

