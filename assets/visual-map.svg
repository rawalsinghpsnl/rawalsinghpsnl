<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#161b3a"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b537f2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b537f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#b537f2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <g stroke="#1c2a4a" stroke-width="1" opacity="0.5">
    <path d="M0 80 H800 M0 160 H800 M0 240 H800 M0 320 H800"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400"/>
  </g>

  <circle cx="400" cy="200" r="180" fill="url(#glowC)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="200" r="120" fill="url(#glowP)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g fill="#00e5ff">
    <circle cx="120" cy="90" r="3" opacity="0.8"><animate attributeName="cy" values="90;60;90" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="110" r="2.5" opacity="0.7"><animate attributeName="cy" values="110;140;110" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.2;0.7" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="300" r="2" opacity="0.6"><animate attributeName="cy" values="300;270;300" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="290" r="3.5" opacity="0.75"><animate attributeName="cy" values="290;320;290" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;0.25;0.75" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="210" r="2" opacity="0.5"><animate attributeName="cx" values="80;110;80" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="220" r="2.5" opacity="0.6"><animate attributeName="cx" values="730;700;730" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="70" r="2" opacity="0.55"><animate attributeName="cy" values="70;95;70" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="330" r="2.5" opacity="0.65"><animate attributeName="cy" values="330;305;330" dur="5.8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#b537f2">
    <circle cx="180" cy="150" r="2.5" opacity="0.7"><animate attributeName="cy" values="150;120;150" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="170" r="3" opacity="0.6"><animate attributeName="cy" values="170;200;170" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.2;0.6" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="250" r="2" opacity="0.5"><animate attributeName="cx" values="260;290;260" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="240" r="2" opacity="0.55"><animate attributeName="cx" values="550;520;550" dur="6.8s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="55" r="2.5" opacity="0.7"><animate attributeName="cy" values="55;80;55" dur="5.9s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="345" r="2" opacity="0.5"><animate attributeName="cy" values="345;320;345" dur="7.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f7df1e">
    <circle cx="150" cy="260" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="260" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="130" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.6">
    <ellipse cx="400" cy="200" rx="150" ry="60">
      <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="24s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="200" rx="150" ry="60" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360 400 200" to="0 400 200" dur="32s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <circle cx="400" cy="200" r="95" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.35" stroke-dasharray="6 8">
    <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- TS -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;0;0;1;1" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.99;1" dur="12s" repeatCount="indefinite"/>
    <rect x="340" y="140" width="120" height="120" rx="12" fill="#3178c6"/>
    <text x="400" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="72" fill="#fff">TS</text>
  </g>
  <!-- AI -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.99;1" dur="12s" repeatCount="indefinite"/>
    <rect x="340" y="140" width="120" height="120" rx="12" fill="#b537f2"/>
    <text x="400" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="72" fill="#fff">AI</text>
  </g>
  <!-- BOT -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.99;1" dur="12s" repeatCount="indefinite"/>
    <rect x="340" y="140" width="120" height="120" rx="12" fill="#00e5ff"/>
    <text x="400" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="#060810">BOT</text>
  </g>

  <text x="400" y="300" text-anchor="middle" font-family="monospace" font-size="15" fill="#00e5ff" letter-spacing="6" opacity="0.9">VISUAL_MAP</text>
  <text x="400" y="48" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e" letter-spacing="4">◈ PARTICLE.SYS — ONLINE ◈</text>

  <g stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M30 60 V30 H60"/><path d="M740 30 H770 V60"/>
    <path d="M30 340 V370 H60"/><path d="M740 370 H770 V340"/>
  </g>
</svg>
